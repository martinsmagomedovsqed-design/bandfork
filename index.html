<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Passband</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=Overpass+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument panel. Slim header, a dense parameter column, and analysis views whose plots sit on dark scope screens inset into the panel.
   Palette: cool grey panel, hard ink outlines with offset shadows, signal orange as the one loud colour; blue, yellow and mint carry state.
   Screens are always dark, with cyan for the designed response, orange for what the load receives, lime for measured data. */
:root{
  --bg:#f4f4f2; --panel:#f4f4f2; --ink:#10131a; --muted:#576070; --line:#dcdcd8; --shc:#10131a; --field:#ffffff;
  --accent:#ff5a1f; --on-accent:#10131a; --blue:#2450ff; --yel:#ffd02a; --mint:#16c48a; --bad:#ff5a1f; --warn:#ffd02a; --ok:#16c48a;
  --scr:#0a0f1e; --scr-grid:#1b2748; --scr-grid2:#121a35; --scr-ink:#e6edff; --scr-muted:#7d8db6;
  --t1:#3de1ff; --t2:#ff7a3d; --t3:#b8ff3d; --band:rgba(61,225,255,.16);
  --f-disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0e11; --panel:#0d0e11; --ink:#eef1f7; --muted:#98a2b4; --line:#24272e; --shc:#000; --field:#10131a;
  --accent:#ff6a33; --blue:#7f98ff; --scr:#070b16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0e11; --panel:#0d0e11; --ink:#eef1f7; --muted:#98a2b4; --line:#24272e; --shc:#000; --field:#10131a;
  --accent:#ff6a33; --blue:#7f98ff; --scr:#070b16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 30px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
p{margin:0}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* header */
header.top{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.logo{width:46px;height:46px;flex:none;border:1px solid var(--ink);border-radius:6px;background:var(--scr);box-shadow:none}
h1{font:700 27px/1 var(--f-disp);margin:0;letter-spacing:-.015em}
.tag{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .grow{flex:1;min-width:0}
.top select{max-width:260px}
select{background:var(--panel);border:1px solid var(--ink);border-radius:4px;padding:6px 10px;font:500 14px var(--f-body);min-height:38px;box-shadow:none}
.btn{background:var(--panel);border:1px solid var(--ink);border-radius:4px;padding:6px 13px;min-height:38px;font-weight:600;font-size:14px;box-shadow:none;transition:transform .06s,box-shadow .06s}
.btn:hover{background:var(--yel);color:#10131a}
.btn:active{box-shadow:0 0 0 var(--shc)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:30px;padding:2px 10px;font-size:13px}
.btn.flat{box-shadow:none;border-width:1.5px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--panel)}
/* tabs */
nav#tabs{display:flex;flex-wrap:wrap;gap:7px}
nav#tabs button{text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;background:var(--panel);border:1px solid var(--ink);border-radius:4px;padding:5px 12px;font:600 14px var(--f-body);box-shadow:none;white-space:nowrap}
nav#tabs button:hover{background:var(--yel);color:#10131a}
nav#tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 var(--shc)}
nav#tabs button[data-tab=circuit]{display:none}
.layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:18px;align-items:start}
/* rail */
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:none;padding:0;min-width:0}
.grp>summary{list-style:none;cursor:pointer;padding:8px 12px;font:700 15px var(--f-disp);display:flex;justify-content:space-between;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"+";font:500 18px var(--f-mono);color:var(--muted)}
.grp[open]>summary::after{content:"–"}
.grp>.in{padding:2px 12px 12px}
.stage{display:flex;align-items:center;gap:7px;font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 0 5px}
.stage:first-child{margin-top:2px}
.stage i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.fld{display:flex;flex-direction:column;gap:1px;min-width:0}
.fld label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.fld .u{font:11px var(--f-mono);opacity:.8}
.fld input{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;font:500 14px var(--f-mono);min-height:32px;text-align:right}
.fld input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--yel)}
.fld input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--field))}
/* main */
main{display:flex;flex-direction:column;gap:14px;min-width:0}
#res{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:none;padding:12px 14px;min-width:0}
.card>h2{font:700 16px/1.2 var(--f-disp);margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .fn{font:500 11px var(--f-mono);background:var(--ink);color:var(--panel);border-radius:4px;padding:1px 6px}
.card>h2 .sp{flex:1}
/* verdict */
.verdict{border:1px solid var(--ink);border-radius:6px;box-shadow:none;padding:12px 14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;color:#10131a}
.verdict.bad{background:var(--bad)}.verdict.warn{background:var(--warn)}.verdict.ok{background:var(--ok)}
.verdict .msg{flex:1;min-width:220px;font:600 19px/1.25 var(--f-disp)}
.verdict .btn{background:#fff;color:#10131a}
.verdict .btn:hover{background:#10131a;color:#fff}
.kf{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 11px;min-width:0}
.k .l{font-size:12px;color:var(--muted)}
.k .v{font:700 24px/1.1 var(--f-disp);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.k .s{font:11.5px var(--f-mono);color:var(--muted)}
.k.hot .v{color:var(--accent)}
.k.link{cursor:pointer}
.k.link:hover{background:var(--yel);color:#10131a}.k.link:hover .l,.k.link:hover .s{color:#333}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1.5px solid var(--ink);vertical-align:-1px}
.led.ok{background:var(--ok)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}
.note{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
/* scope screens */
.scr{background:var(--scr);border-radius:9px;padding:4px 4px 2px;border:1.5px solid var(--ink)}
.scr:has(+.scr-leg){border-radius:9px 9px 0 0;border-bottom:0}
.scr-leg{background:var(--scr);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 9px 9px;padding:2px 10px 7px;display:flex;flex-wrap:wrap;gap:3px 16px;font-size:12.5px;color:var(--scr-muted)}
.scr-leg i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
svg{display:block;width:100%;height:auto}
svg text{font:10.5px var(--f-mono);fill:var(--muted)}
.scr svg text{fill:var(--scr-muted)}
.scr svg .fr{fill:none;stroke:var(--scr-muted);stroke-width:1;opacity:.7}
.scr svg .gl{stroke:var(--scr-grid);stroke-width:1}
.scr svg .gm{stroke:var(--scr-grid2);stroke-width:1}
.scr svg .l1{stroke:var(--t1);stroke-width:2.2;fill:none;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(61,225,255,.55))}
.scr svg .l2{stroke:var(--t2);stroke-width:2.2;fill:none;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(255,122,61,.55))}
.scr svg .l3{stroke:var(--t3);stroke-width:1.8;fill:none;stroke-dasharray:6 3}
.scr svg .l4{stroke:var(--scr-ink);stroke-width:1.4;fill:none;stroke-dasharray:1 4}
.scr svg .l5{stroke:var(--scr-muted);stroke-width:1.5;fill:none;stroke-dasharray:7 4}
.scr svg .bd{fill:var(--band)}
.scr svg .pt{fill:var(--t3);stroke:var(--scr);stroke-width:1.5}
.scr svg .bar{fill:var(--t1)}
.scr svg .bar2{fill:var(--t2)}
.scr svg .vl{stroke:var(--scr-muted);stroke-dasharray:4 3}
.scr svg .lab{fill:var(--scr-ink)}
.scr svg .hvl{stroke:var(--scr-ink);stroke-width:1;opacity:.7}
.scr svg .hvt{fill:var(--scr-ink);stroke:var(--scr);stroke-width:4;paint-order:stroke;font-size:11px}
svg.plot{touch-action:pan-y;cursor:crosshair}
svg .hd{cursor:grab;touch-action:none}
svg .hd:active{cursor:grabbing}
svg .hd .hit{fill:transparent}
svg .hd .dot{fill:var(--yel);stroke:var(--scr);stroke-width:2.5}
svg .hd text{fill:var(--yel);font:600 10px var(--f-mono)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-body);color:var(--muted);white-space:nowrap}
td.m{font:12.5px var(--f-mono);white-space:nowrap}
.tw{overflow-x:auto}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks .led{margin:0;width:13px;height:13px}
.checks .d{font:12.5px var(--f-mono);color:var(--muted);text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:none}
.toggle button{background:var(--panel);border:0;border-right:2px solid var(--ink);padding:5px 12px;font:600 13.5px var(--f-body)}
.toggle button:last-child{border-right:0}
.toggle button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:6px 12px;align-items:center}
.ctl label{font-size:14px}
.ctl input[type=text],.inp{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;font:500 14px var(--f-mono);min-height:32px;text-align:right}
.inp.left{text-align:left}
.ctl input[type=text]:focus,.inp:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--yel)}
textarea{width:100%;min-height:110px;background:var(--field);border:1.5px solid var(--line);border-radius:4px;padding:9px;font:12.5px/1.5 var(--f-mono)}
.copybox{white-space:pre-wrap;background:var(--field);border:1.5px solid var(--line);border-radius:4px;padding:12px;font:12.5px/1.55 var(--f-mono)}
.saved{list-style:none;margin:6px 0 0;padding:0}
.saved li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.saved li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.out{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:10px;font:13px var(--f-mono)}
.out b{font-weight:500;text-align:right}
.out span{color:var(--muted)}
.bigbtn{width:64px;height:64px;border-radius:50%;border:1px solid var(--ink);background:var(--accent);color:var(--on-accent);font:700 22px var(--f-disp);box-shadow:none}
.bigbtn:active{box-shadow:0 0 0 var(--shc)}
canvas{width:100%;height:150px;display:block;border-radius:9px;background:var(--scr);border:1.5px solid var(--ink)}
.prose{max-width:68ch;font-size:14.5px}
.prose h3{font:700 15px var(--f-disp);margin:14px 0 3px}
.prose p+p{margin-top:6px}
.prose kbd{font:12px var(--f-mono);border:1.5px solid var(--line);padding:0 5px;border-radius:4px}
[hidden]{display:none!important}
@media(max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  body[data-tab=circuit] main{display:none}
  body:not([data-tab=circuit]) .rail{display:none}
  nav#tabs button[data-tab=circuit]{display:block}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--ink);flex-wrap:nowrap;overflow-x:auto;gap:4px;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav#tabs button{flex:none;box-shadow:none;border-width:1.5px;padding:7px 12px}
  nav#tabs button[aria-selected=true]{transform:none}
  body{padding-block-end:76px}
  .top select{max-width:100%;flex:1}
}
@media(prefers-reduced-motion:no-preference){#res>*{animation:rise .22s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}

/* typographic refinements */
h1{letter-spacing:.01em;text-transform:uppercase;font-size:23px}
nav#tabs button{font:600 12.5px var(--f-disp);text-transform:uppercase;letter-spacing:.07em}
.card>h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.kf .v,.k .v{font-family:var(--f-disp)}
.btn,.toggle button{font-family:var(--f-disp);letter-spacing:.03em;font-size:13px}

/* minimal pass */
h1{font:600 20px/1 var(--f-disp);text-transform:none;letter-spacing:0}
.tag{font-size:12px}
.logo{border:0;box-shadow:none;border-radius:8px;width:38px;height:38px}
nav#tabs{gap:2px 18px;border-bottom:1px solid var(--line);padding-bottom:0}
nav#tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 0;min-height:0;font:500 14px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
nav#tabs button:hover{color:var(--ink)}
nav#tabs button[aria-selected=true]{background:none;color:var(--ink);border-bottom-color:var(--accent)}
.card,.grp{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 6px}
.grp>summary{padding-left:0;padding-right:0}
.card>h2{font:500 12px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card>h2 .fn{background:none;color:var(--muted);padding:0;font-size:11px}
.k{background:none;border:0;border-left:1px solid var(--line);border-radius:0;padding:2px 14px}
.kf{gap:6px}
.k .l{color:var(--muted)}
.verdict,.verdict.bad,.verdict.warn,.verdict.ok{background:none;color:var(--ink);border:0;border-left:3px solid var(--accent);border-radius:0;padding:4px 0 4px 16px}
.verdict.warn{border-left-color:var(--warn)}.verdict.ok{border-left-color:var(--ok)}
.verdict .msg{font:500 20px/1.3 var(--f-disp)}
.verdict .btn,.btn{background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:32px;font:500 13px var(--f-body);letter-spacing:0}
.btn:hover,.verdict .btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{border:1px solid var(--line);border-radius:999px}
.toggle button{font:500 13px var(--f-body);letter-spacing:0}
select{border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.fld input,.inp,textarea,.copybox{border-color:var(--line);background:transparent}
.scr{border:0;border-radius:6px}
canvas{border:0}
.bigbtn{border:0}
@media(max-width:760px){nav#tabs{border-bottom:0}nav#tabs button{padding:7px 12px;border:1px solid var(--line);border-radius:999px}nav#tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 46 46" role="img" aria-label="Band-pass curve"><path d="M5 38C13 38 15 10 23 10S33 38 41 38" fill="none" stroke="#3de1ff" stroke-width="3" stroke-linecap="round"/><path d="M5 41C16 41 18 22 23 22S30 41 41 41" fill="none" stroke="#ff7a3d" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="grow"><h1>Passband</h1><div class="tag">Signal-chain analysis</div></div>
    <select id="preset" aria-label="Example circuit"></select>
    <button class="btn" id="theme" type="button" aria-label="Switch light or dark theme">Light / dark</button>
    <button class="btn primary" id="install" type="button" hidden>Install</button>
  </header>
  <nav id="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="circuit">Circuit</button>
    <button role="tab" data-tab="response">Response</button>
    <button role="tab" data-tab="loading">Loading</button>
    <button role="tab" data-tab="tolerance">Tolerance</button>
    <button role="tab" data-tab="noise">Noise</button>
    <button role="tab" data-tab="level">Level</button>
    <button role="tab" data-tab="design">Design</button>
    <button role="tab" data-tab="listen">Listen</button>
    <button role="tab" data-tab="tools">Tools</button>
    <button role="tab" data-tab="validate">Validate</button>
    <button role="tab" data-tab="check">Check</button>
    <button role="tab" data-tab="about">About</button>
  </nav>
  <div class="layout">
    <div class="rail">
      <details class="grp" open><summary>Signal chain</summary><div class="in">
        <div class="stage"><i style="background:var(--accent)"></i>High-pass</div><div class="fgrid" id="f-hp"></div>
        <div class="stage"><i style="background:var(--blue)"></i>Gain stage</div><div class="fgrid" id="f-g"></div>
        <div class="stage"><i style="background:var(--yel)"></i>Low-pass</div><div class="fgrid" id="f-lp"></div>
        <div class="stage"><i style="background:var(--mint)"></i>Output network and load</div><div class="fgrid" id="f-out"></div>
      </div></details>
      <details class="grp"><summary>Tolerance, supply, noise</summary><div class="in"><div class="fgrid" id="f-misc"></div></div></details>
      <details class="grp"><summary>Builds and sharing</summary><div class="in" id="builds"></div></details>
    </div>
    <main id="view"></main>
  </div>
</div>
<script>
const E6=[1.0,1.5,2.2,3.3,4.7,6.8];
function snapUp(x,s){const dec=Math.pow(10,Math.floor(Math.log10(x)));const m=x/dec;for(const v of s){if(v>=m*(1-1e-9))return v*dec;}return s[0]*dec*10;}
function parseSI(str){
  const m=String(str).trim().match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?)\s*([pnuµmkMG]?)\s*[A-Za-zΩ%]*$/);
  if(!m) return NaN;
  const mult={'':1,p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,m:1e-3,k:1e3,M:1e6,G:1e9};
  return parseFloat(m[1])*mult[m[2]];
}
function fmt(x,unit,dig){
  dig=dig||3;
  if(!isFinite(x)) return '–';
  if(x===0) return '0 '+unit;
  const pre=['p','n','µ','m','','k','M','G'];
  let e=Math.floor(Math.log10(Math.abs(x))/3);e=Math.max(-4,Math.min(3,e));
  let v=x/Math.pow(10,3*e);
  if(Math.abs(parseFloat(v.toPrecision(dig)))>=1000&&e<3){e++;v=x/Math.pow(10,3*e);}
  return parseFloat(v.toPrecision(dig))+' '+pre[e+4]+unit;

  root.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.hd');if(!h)return;drag={id:h.dataset.h};try{root.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  root.addEventListener('pointermove',e=>{if(!drag||dragRaf)return;dragRaf=requestAnimationFrame(()=>{dragRaf=0;if(drag)applyDrag(e.clientX,e.clientY);});});
  const end=()=>{drag=null;};root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
}
function applyDrag(cx,cy){
  const svg=document.querySelector('svg.plot[data-main]');if(!svg||anyBad())return;
  const c=CH[+svg.dataset.ch],pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const f=Math.min(c.x1/1.02,Math.max(c.x0*1.02,c.inX(Math.min(c.W-c.r,Math.max(c.l,p.x))))),dB=c.inY(p.y),Q=Pn();
  const sn=(v,s)=>ui.snap?snapNearE(v,s):v;
  if(drag.id==='hp')setField('Rhigh',sn(1/(2*Math.PI*f*Q.Chigh),E24));
  else if(drag.id==='lp')setField('Rlow',sn(1/(2*Math.PI*f*Q.Clow),E24));
  else if(drag.id==='gain'){const g=Math.max(1.05,Math.pow(10,dB/20));setField('R2',sn((g-1)*Q.R1,E24));}
  else if(drag.id==='out')setField('Cprot',sn(1/(2*Math.PI*f*(Q.Rprot+Q.Rload)),E6));
  calc();
}
function hist(vals,nom,unit,W){
  W=(W&&innerWidth<600)?440:(W||420);const H=170,l=10,r=10,t=10,b=34,n=14;
  const mn=Math.min(...vals),mx=Math.max(...vals),bw=(mx-mn)/n||1,c=Array(n).fill(0);
  vals.forEach(v=>c[Math.min(n-1,Math.floor((v-mn)/bw))]++);
  const cm=Math.max(...c),X=v=>l+(W-l-r)*(v-mn)/(mx-mn||1),bwp=(W-l-r)/n;
  let s=`<div class="scr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of ${unit}">`;
  c.forEach((k,i)=>{const h=(H-b-t)*k/cm;s+=`<rect class="bar" x="${l+i*bwp+1}" y="${H-b-h}" width="${bwp-2}" height="${h}" opacity=".9"/>`;});
  s+=`<line class="vl" x1="${X(nom)}" x2="${X(nom)}" y1="${t}" y2="${H-b}" style="stroke:var(--t2);stroke-dasharray:none;stroke-width:2"/>`;
  s+=`<text x="${l}" y="${H-16}">${fmt(mn,unit,3)}</text><text x="${W-r}" y="${H-16}" text-anchor="end">${fmt(mx,unit,3)}</text><text class="lab" x="${Math.min(Math.max(X(nom),55),W-55)}" y="${H-3}" text-anchor="middle">nominal ${fmt(nom,unit,3)}</text></svg></div>`;
  return s;
}
const LCOL={c1:'--t1',c2:'--t2',c3:'--t3',ink:'--scr-ink',muted:'--scr-muted',band:'--band'};
const legend=a=>`<div class="scr-leg">${a.map(([c,t])=>`<span><i style="border-color:var(${LCOL[c]})"></i>${t}</span>`).join('')}</div>`;
function nice(m){const p=Math.pow(10,Math.floor(Math.log10(m))),r=m/p,st=r<=2?p/2:r<=5?p:p*2;return {max:Math.ceil(m/st)*st,step:st};}

const V={};
const lim_=Q=>Math.max(0.1,Q.Vs-2);
/* ---------- checks, shared by Response and Check ---------- */
function runChecks(Q,S){
  const T={fl:parseSI(ui.tfl),fh:parseSI(ui.tfh),g:parseSI(ui.tg)},o=[],add=(n,s,d)=>o.push({n,s,d});
  if(T.fl>0&&Number.isFinite(S.cq.lo)){const r=S.cq.lo/T.fl;add('Lower corner at the load',r>=.8&&r<=1.25?'ok':r<=2?'warn':'bad',`${fq(S.cq.lo)} vs ${fq(T.fl)}`);}
  if(T.fh>0&&Number.isFinite(S.cq.hi)){const r=S.cq.hi/T.fh;add('Upper corner at the load',r>=.8&&r<=1.25?'ok':(r>=.6&&r<=1.6)?'warn':'bad',`${fq(S.cq.hi)} vs ${fq(T.fh)}`);}
  if(T.g>1){const d=S.cq.peak-db(T.g);add('Gain at the load',Math.abs(d)<=1?'ok':Math.abs(d)<=3?'warn':'bad',`${S.cq.peak.toFixed(1)} dB vs ${db(T.g).toFixed(1)} dB`);}
  add('Output network corner',S.fprot<=S.cp.lo/2?'ok':S.fprot<=S.cp.lo?'warn':'bad',`${fq(S.fprot)}, band starts ${fq(S.cp.lo)}`);
  const rss=Math.sqrt(Q.Rtol**2+Q.Ctol**2)*100;add('Component tolerance',rss<=10?'ok':rss<=15?'warn':'bad',`corners ±${rss.toFixed(1)}%`);
  const fm=Math.sqrt(S.cp.lo*S.cp.hi)||1000,N=noiseTotals(Q,Math.max(0.05,S.cp.lo/2),S.cp.hi*2,ui.aw),r=resp(fm,Q),mx=lim_(Q)/Math.SQRT2*r.div*r.lpm,dr=20*Math.log10(mx/N.total);
  add('Dynamic range',dr>=80?'ok':dr>=60?'warn':'bad',`${dr.toFixed(0)} dB, noise ${fmt(N.total,'V',3)}`);
  const vs=parseSI(ui.vsrc),f=parseSI(ui.freq);
  if(vs>0&&f>0){const sm=sim(Q,f,vs/2),pk=Math.max(...Array.from(sm.o).map(Math.abs));add('Clipping at the test level',sm.thdO<0.01?'ok':'bad',`THD ${sm.thdO<1e-4?'< 0.01':(sm.thdO*100).toFixed(1)}% at ${fmt(vs,'V',2)} p-p in`);}
  return {list:o,N,fm};
}
const ledc=s=>`<span class="led ${s}"></span>`;
/* ---------- response ---------- */
V.response={
  build(){return `<div id="res"></div>`;},
  calc(res){
    const Q=Pn(),S=stats(Q),C=curves(Q),ck=runChecks(Q,S).list,okn=ck.filter(c=>c.s==='ok').length;
    const dLoss=S.cq.peak-S.cp.peak,shift=S.cq.lo/S.cp.lo,g=1+Q.R2/Q.R1;
    let vc,msg;
    if(dLoss<-3||shift>1.5){vc='bad';msg=`The output network costs ${Math.abs(dLoss).toFixed(1)} dB and moves the lower corner from ${fq(S.cp.lo)} to ${fq(S.cq.lo)}.`;}
    else if(dLoss<-1||shift>1.15){vc='warn';msg=`The output network costs ${Math.abs(dLoss).toFixed(1)} dB and shifts the lower corner from ${fq(S.cp.lo)} to ${fq(S.cq.lo)}.`;}
    else{vc='ok';msg=`The output network is transparent: ${Math.abs(dLoss).toFixed(1)} dB loss, lower corner stays at ${fq(S.cq.lo)}.`;}
    const y1=Math.ceil((S.cp.peak+6)/10)*10,y0=y1-90;
    let ch;

    const gx=Math.sqrt((S.cp.lo||RNG.a*10)*(S.cp.hi||RNG.b/10));
    const handles=[...hp,...lp,{id:'gain',x:gx,y:S.cp.peak,label:'GAIN'},{id:'out',x:Math.min(RNG.b/1.05,Math.max(RNG.a*1.05,S.fprot)),y:S.at(S.fprot).post,label:'OUT'}];
    const deg=a=>a*180/Math.PI,fs=C.fs;
    if(ui.rview==='gain') ch=chart({main:true,label:'Gain versus frequency, designed and delivered',x:[RNG.a,RNG.b],y:[y0,y1],ystep:10,xt:XT,ylab:'dB',handles,series:[{cls:'l1',x:fs,y:C.pre},{cls:'l2',x:fs,y:C.post}]})+legend([['c1','Chain output, as designed'],['c2','Delivered to the load']]);
    else if(ui.rview==='phase') ch=chart({label:'Phase versus frequency',x:[RNG.a,RNG.b],y:[-270,270],ystep:90,xt:XT,ylab:'degrees',yu:'°',series:[{cls:'l1',x:fs,y:C.R.map(r=>deg(r.phpre))},{cls:'l2',x:fs,y:C.R.map(r=>deg(r.ph))}]})+legend([['c1','Chain output'],['c2','Load']]);
    else{
      const gd=k=>{const y=[],x=[];for(let i=0;i<fs.length-1;i++){y.push(-(C.R[i+1][k]-C.R[i][k])/(2*Math.PI*(fs[i+1]-fs[i]))*1e3);x.push(Math.sqrt(fs[i]*fs[i+1]));}return {x,y};};
      const a=gd('phpre'),b=gd('ph'),inb=b.x.map((f,i)=>f>=S.cp.lo&&f<=S.cp.hi?Math.max(a.y[i],b.y[i]):0),gm=nice(Math.max(...inb,1e-6)*1.3);
      ch=chart({label:'Group delay versus frequency',x:[RNG.a,RNG.b],y:[0,gm.max],ystep:gm.step,xt:XT,ylab:'ms',yu:'ms',series:[{cls:'l1',x:a.x,y:a.y},{cls:'l2',x:b.x,y:b.y}]})+legend([['c1','Chain output'],['c2','Load']]);
    }
    const frs=[S.cp.lo/2,S.cp.lo,Math.sqrt(S.cp.lo*S.cp.hi),S.cp.hi,S.cp.hi*2].filter(Number.isFinite);
    const rows=frs.map(f=>{const a=S.at(f);return `<tr><td class="m">${fmt(f,'Hz',3)}</td><td class="m">${a.pre.toFixed(1)} dB</td><td class="m">${a.post.toFixed(1)} dB</td><td class="m">${a.div.toFixed(1)} dB</td></tr>`;}).join('');
    res.innerHTML=`

    <div class="kf">
      <div class="k"><div class="l">Designed gain</div><div class="v">${S.cp.peak.toFixed(1)} dB</div><div class="s">×${g.toFixed(g<100?1:0)} in the gain stage</div></div>
      <div class="k"><div class="l">Designed band</div><div class="v">${fq(S.cp.lo)} – ${fq(S.cp.hi)}</div><div class="s">–3 dB</div></div>
      <div class="k hot"><div class="l">At the load</div><div class="v">${S.cq.peak.toFixed(1)} dB</div><div class="s">${dLoss.toFixed(1)} dB vs design</div></div>
      <div class="k hot"><div class="l">Delivered band</div><div class="v">${fq(S.cq.lo)} – ${fq(S.cq.hi)}</div><div class="s">–3 dB</div></div>
      <div class="k link" data-go="check" tabindex="0" role="link"><div class="l">Checks passed</div><div class="v">${okn} of ${ck.length}</div><div class="s">${ck.map(c=>ledc(c.s)).join('')}</div></div>
    </div>
    <div class="card"><h2>Frequency response <span class="sp"></span>
      <span class="toggle" id="rv">${[['gain','Gain'],['phase','Phase'],['delay','Delay']].map(([k,t])=>`<button type="button" data-v="${k}" aria-pressed="${ui.rview===k}">${t}</button>`).join('')}</span>
      ${ui.rview==='gain'?`<button class="btn sm flat" id="snap" type="button" aria-pressed="${ui.snap}" title="Round dragged values to standard resistors and capacitors">Snap to standard values</button>`:''}</h2>
      ${ch}

    </div>
    <details class="card"><summary style="cursor:pointer;font:700 15px var(--f-disp)">Values at key frequencies</summary><div class="tw" style="margin-top:8px"><table><tr><th>Frequency</th><th>Chain output</th><th>Load</th><th>Loss</th></tr>${rows}</table></div></details>`;
    res.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>{location.hash=b.dataset.go;};b.onkeydown=e=>{if(e.key==='Enter')location.hash=b.dataset.go;};});
    $('rv').onclick=e=>{const b=e.target.closest('button');if(b){ui.rview=b.dataset.v;calc();}};
    const sn=$('snap');if(sn)sn.onclick=()=>{ui.snap=!ui.snap;sn.setAttribute('aria-pressed',String(ui.snap));};
  }
};
/* ---------- loading ---------- */
V.loading={
  build(){return `<div class="card"><h2>Load impedance</h2><div class="chips" id="loads"></div></div><div id="res"></div>`;},
  after(){
    $('loads').innerHTML=[8,32,100,600,1e4,1e5].map(z=>`<button class="btn sm" data-z="${z}" type="button" aria-pressed="false">${fmt(z,'Ω',2).replace(' ','')}</button>`).join('');
    $('loads').onclick=e=>{const b=e.target.closest('button');if(!b)return;setField('Rload',+b.dataset.z);calc();};
  },
  calc(res){
    const Q=Pn();document.querySelectorAll('#loads button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.z===Q.Rload)));
    const fs=logGrid(RNG.a,RNG.b,260),dv=z=>fs.map(f=>db(resp(f,{...Q,Rload:z}).div));
    const S=stats(Q),fm=Math.sqrt(S.cp.lo*S.cp.hi),L=f=>S.at(f).div;
    const tp=parseSI(ui.tfp)>0?parseSI(ui.tfp):10,Cneed=1/(2*Math.PI*(Q.Rprot+Q.Rload)*tp),Cs=snapUp(Cneed,E6),S2=stats({...Q,Cprot:Cs});

      <div class="k hot"><div class="l">Output network corner</div><div class="v">${fq(S.fprot)}</div></div>
      <div class="k hot"><div class="l">Loss at ${fq(S.cp.lo)}</div><div class="v">${L(S.cp.lo).toFixed(1)} dB</div></div>
      <div class="k hot"><div class="l">Loss at ${fq(fm)}</div><div class="v">${L(fm).toFixed(1)} dB</div></div>
      <div class="k hot"><div class="l">Loss at ${fq(S.cp.hi)}</div><div class="v">${L(S.cp.hi).toFixed(1)} dB</div></div>
    </div>
    <div class="card"><h2>Attenuation of the output network</h2>
      ${chart({label:'Divider attenuation versus frequency for several loads',x:[RNG.a,RNG.b],y:[-60,0],ystep:10,xt:XT,ylab:'dB',series:[{cls:'l5',x:fs,y:dv(Q.Rload/4)},{cls:'l4',x:fs,y:dv(Q.Rload*4)},{cls:'l3',x:fs,y:dv(Q.Rload*20)},{cls:'l2',x:fs,y:dv(Q.Rload)}]})}

  }

/* ---------- tolerance ---------- */
V.tolerance={
  build(){return `<div id="res"></div>`;},
  calc(res){
    const Q=Pn(),N=300,M=monteCarlo(Q,N,11,RNG.a,RNG.b),S=stats(Q);
    const rss=Math.sqrt(Q.Rtol*Q.Rtol+Q.Ctol*Q.Ctol),fl=1/(2*Math.PI*Q.Rhigh*Q.Chigh),fh=1/(2*Math.PI*Q.Rlow*Q.Clow),g0=db(1+Q.R2/Q.R1);
    const rg=Math.sqrt(2)*Q.Rtol*(Q.R2/Q.R1)/(1+Q.R2/Q.R1),mm=a=>[Math.min(...a),Math.max(...a)];
    const [a1,a2]=mm(M.fl),[b1,b2]=mm(M.fh),[c1,c2]=mm(M.gn),y1=Math.ceil((S.cp.peak+6)/10)*10;
    res.innerHTML=`
    <div class="kf">
      <div class="k"><div class="l">Corner spread (RSS)</div><div class="v">±${(rss*100).toFixed(1)}%</div></div>
      <div class="k"><div class="l">Gain spread (RSS)</div><div class="v">±${(20*Math.log10(1+rg)).toFixed(2)} dB</div></div>
      <div class="k"><div class="l">Random builds</div><div class="v">${N}</div></div>
    </div>
    <div class="card"><h2>Envelope over ${N} builds</h2>
      ${chart({label:'Response envelope under component tolerances',x:[RNG.a,RNG.b],y:[y1-70,y1],ystep:10,xt:XT,ylab:'dB',band:{x:M.fs,lo:M.mn,hi:M.mx},series:[{cls:'l1',x:M.fs,y:M.fs.map(f=>db(resp(f,Q).pre))}]})}
      ${legend([['c1','Nominal'],['band','Min to max']])}</div>
    <div class="two"><div class="card"><h2>High-pass corner</h2>${hist(M.fl,fl,'Hz')}</div><div class="card"><h2>Low-pass corner</h2>${hist(M.fh,fh,'Hz')}</div></div>
    <div class="card"><h2>Gain</h2>${hist(M.gn,g0,'dB',660)}</div>
    <div class="card"><div class="tw"><table><tr><th>Quantity</th><th>Nominal</th><th>RSS</th><th>Simulated range</th></tr>
      <tr><td>High-pass corner</td><td class="m">${fmt(fl,'Hz',3)}</td><td class="m">±${(rss*100).toFixed(1)}%</td><td class="m">${fmt(a1,'Hz',3)} – ${fmt(a2,'Hz',3)}</td></tr>
      <tr><td>Low-pass corner</td><td class="m">${fmt(fh,'Hz',3)}</td><td class="m">±${(rss*100).toFixed(1)}%</td><td class="m">${fmt(b1,'Hz',3)} – ${fmt(b2,'Hz',3)}</td></tr>
      <tr><td>Gain</td><td class="m">${g0.toFixed(2)} dB</td><td class="m">±${(20*Math.log10(1+rg)).toFixed(2)} dB</td><td class="m">${c1.toFixed(2)} – ${c2.toFixed(2)} dB</td></tr></table></div>
      <p class="note" style="margin-top:6px">Uniform draws within tolerance. The simulated range can exceed RSS because errors add directly in some builds.</p></div>`;
  }
};
/* ---------- noise ---------- */
V.noise={
  build(){return `<div class="card"><div class="row"><div class="ctl" style="grid-template-columns:auto 110px"><label for="in-sig">Signal at the load (V rms)</label><input type="text" id="in-sig" value="${esc(ui.nsig||'')}" autocomplete="off"></div><span class="toggle"><button type="button" id="aw" aria-pressed="${ui.aw}">A-weighted</button></span></div></div><div id="res"></div>`;},
  after(){$('in-sig').oninput=e=>{ui.nsig=e.target.value;calc();};$('aw').onclick=e=>{ui.aw=!ui.aw;e.currentTarget.setAttribute('aria-pressed',String(ui.aw));calc();};},
  calc(res){
    const Q=Pn(),S=stats(Q),f1=Math.max(0.05,S.cp.lo/2),f2=S.cp.hi*2;
    const fm=Math.sqrt(S.cp.lo*S.cp.hi),N=noiseTotals(Q,f1,f2,ui.aw);

    const rows=N.names.map((n,i)=>[n,Math.sqrt(N.d1k[i][1])*1e9,Math.sqrt(N.acc[i])*1e6,N.acc[i]/sum*100]).sort((a,b)=>b[3]-a[3]).map(r=>`<tr><td>${r[0]}</td><td class="m">${r[1].toFixed(2)} nV/√Hz</td><td class="m">${r[2].toFixed(2)} µV</td><td class="m">${r[3].toFixed(1)}%</td></tr>`).join('');
    res.innerHTML=`
    <div class="kf">
      <div class="k hot"><div class="l">Output noise</div><div class="v">${fmt(N.total,'V',3)}</div><div class="s">rms, ${fq(f1)} to ${fq(f2)}</div></div>
      <div class="k"><div class="l">Signal to noise</div><div class="v">${snr.toFixed(1)} dB</div><div class="s">at ${fmt(sig,'V',3)} rms</div></div>
      <div class="k"><div class="l">Referred to input</div><div class="v">${fmt(N.total/resp(fm,Q).post,'V',3)}</div><div class="s">at ${fq(fm)}</div></div>
      <div class="k"><div class="l">Dynamic range</div><div class="v">${(20*Math.log10(maxO/N.total)).toFixed(0)} dB</div><div class="s">clip to noise floor</div></div>
    </div>
    <div class="card"><h2>Noise density at the load</h2>
      ${chart({label:'Output noise density versus frequency',x:[RNG.a,RNG.b],y:[lo,hi],ystep:10,xt:XT,ylab:'dB re 1 nV/√Hz',yu:'dB',series:[{cls:'l2',x:fs,y:d}]})}</div>
    <div class="card"><h2>Contributions</h2><div class="tw"><table><tr><th>Source</th><th>At ${fq(fm)}</th><th>Integrated</th><th>Share</th></tr>${rows.replace(/At 1 kHz/,'')}</table></div>
      <p class="note" style="margin-top:6px">Largest: ${N.names[mi].toLowerCase()}. The output network scales signal and noise together, so it costs level but not signal to noise.</p></div>`;
  }
};
/* ---------- level and distortion ---------- */
function harmBars(h){

      if(!isFinite(v)||!(z>0)){$('lv-o').innerHTML='<span>Enter a number</span><b></b>';return;}
      vr=u==='rms'?v:u==='pk'?v/Math.SQRT2:u==='pp'?v/(2*Math.SQRT2):u==='dbv'?Math.pow(10,v/20):u==='dbu'?0.7745967*Math.pow(10,v/20):Math.sqrt(Math.pow(10,v/10)*1e-3*z);
      if(!(vr>0)){$('lv-o').innerHTML='<span>Enter a positive level</span><b></b>';return;}
      $('lv-o').innerHTML=row('V rms',fmt(vr,'V',4))+row('V peak',fmt(vr*Math.SQRT2,'V',4))+row('V p-p',fmt(vr*2*Math.SQRT2,'V',4))+row('dBV',(20*Math.log10(vr)).toFixed(2)+' dBV')+row('dBu',(20*Math.log10(vr/0.7745967)).toFixed(2)+' dBu')+row('dBm',(10*Math.log10(vr*vr/z/1e-3)).toFixed(2)+' dBm')+row('Power',fmt(vr*vr/z,'W',3));};
    const dd=()=>{const v=parseSI($('db-v').value),u=$('db-u').value;if(!isFinite(v)||((u==='v'||u==='p')&&!(v>0))){$('db-o').innerHTML='<span>Enter a valid value</span><b></b>';return;}
      const vr=u==='v'?v:u==='p'?Math.sqrt(v):u==='dv'?Math.pow(10,v/20):Math.pow(10,v/20);
      $('db-o').innerHTML=row('Voltage ratio',vr.toPrecision(5))+row('Power ratio',(vr*vr).toPrecision(5))+row('dB (voltage)',(20*Math.log10(vr)).toFixed(3))+row('1 dB equals',((Math.pow(10,1/20)-1)*100).toFixed(1)+'% in voltage');};
    const rc=()=>{const r=parseSI($('rc-r').value),c=parseSI($('rc-c').value);if(!(r>0&&c>0)){$('rc-o').innerHTML='<span>Enter R and C</span><b></b>';return;}
      const t=r*c,f=1/(2*Math.PI*t);$('rc-o').innerHTML=row('Corner frequency',fmt(f,'Hz',4))+row('Time constant',fmt(t,'s',4))+row('Rise time 10–90%',fmt(2.2*t,'s',4))+row('Settling to 1%',fmt(4.6*t,'s',4))+row('ω',fmt(1/t,'rad/s',4));};
    const er=()=>{const t=parseSI($('er-v').value);if(!(t>0)){$('er-o').innerHTML='<span>Enter a resistance</span><b></b>';return;}
      const b=bestR(t);$('er-o').innerHTML=row('Single E24',`${b.single.label} (${(b.single.err*100).toFixed(2)}%)`)+row('In series',`${b.series.label} (${(b.series.err*100).toFixed(3)}%)`)+row('In parallel',`${b.parallel.label} (${(b.parallel.err*100).toFixed(3)}%)`);};
    [['lv-v',lv],['lv-u',lv],['lv-z',lv],['db-v',dd],['db-u',dd],['rc-r',rc],['rc-c',rc],['er-v',er]].forEach(([id,f])=>$(id).addEventListener('input',f));
    lv();dd();rc();er();
  }
};
/* ---------- validate ---------- */
V.validate={
  build(){return `<div class="card"><h2>Measured response</h2>
    <textarea id="data" spellcheck="false" aria-label="Measured frequency and gain pairs" placeholder="One pair per line: frequency, gain in dB&#10;100, 20.1&#10;1k, 20.8&#10;10k, 17.9"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="ex" type="button">Synthetic example</button><button class="btn" id="clr" type="button">Clear</button>
    <span class="toggle" id="curve">${[['pre','vs chain output'],['post','vs the load']].map(([k,t])=>`<button type="button" data-c="${k}" aria-pressed="false">${t}</button>`).join('')}</span></div></div><div id="res"></div>`;},
  after(){
    $('data').value=ui.data||'';
    $('data').oninput=e=>{ui.data=e.target.value;ui.synthetic=false;calc();};
    $('ex').onclick=()=>{const Q=Pn(),R=mulberry32(5),Qm={...Q,Rhigh:Q.Rhigh*1.06,Chigh:Q.Chigh*0.97,Rlow:Q.Rlow*0.95,Clow:Q.Clow*1.04};
      ui.data=logGrid(RNG.a*1.5,RNG.b/1.5,22).map(f=>{const d=db(resp(f,Qm)[ui.curve]);return fmt(f,'',3).trim().replace(' ','')+', '+(d+(R()-.5)*0.8).toFixed(2);}).join('\n');
      ui.synthetic=true;$('data').value=ui.data;calc();};
    $('clr').onclick=()=>{ui.data='';ui.synthetic=false;$('data').value='';calc();};
    $('curve').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.curve=b.dataset.c;calc();};
  },
  calc(res){
    document.querySelectorAll('#curve button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===ui.curve)));
    const pts=(ui.data||'').split('\n').map(l=>l.trim().split(/[,;\t ]+/)).map(a=>({x:parseSI(a[0]),y:parseFloat(a[1])})).filter(p=>p.x>0&&isFinite(p.y)).sort((a,b)=>a.x-b.x);
    const Q=Pn(),C=curves(Q),S=stats(Q),y1=Math.ceil((S.cp.peak+6)/10)*10,cls=ui.curve==='pre'?'l1':'l2';
    if(pts.length<3){res.innerHTML=`<div class="card"><h2>Model</h2>${chart({label:'Model response',x:[RNG.a,RNG.b],y:[y1-90,y1],ystep:10,xt:XT,ylab:'dB',series:[{cls,x:C.fs,y:C[ui.curve]}]})}<p class="note" style="margin-top:6px">Paste at least three measured points to compare.</p></div>`;return;}
    const mod=pts.map(p=>db(resp(p.x,Q)[ui.curve])),err=pts.map((p,i)=>p.y-mod[i]);
    const rms=Math.sqrt(err.reduce((a,e)=>a+e*e,0)/err.length),mi=err.reduce((m,e,i)=>Math.abs(e)>Math.abs(err[m])?i:m,0);
    const mc=corners(pts.map(p=>p.x),pts.map(p=>p.y)),Mc=corners(FS,FS.map(f=>db(resp(f,Q)[ui.curve])));
    res.innerHTML=`${ui.synthetic?'<div class="verdict warn"><div class="msg">Synthetic example data, not a measurement.</div></div>':''}
    <div class="kf">
      <div class="k"><div class="l">RMS error</div><div class="v">${rms.toFixed(2)} dB</div><div class="s">${pts.length} points</div></div>
      <div class="k"><div class="l">Largest error</div><div class="v">${err[mi].toFixed(1)} dB</div><div class="s">at ${fq(pts[mi].x)}</div></div>
      <div class="k"><div class="l">Measured band</div><div class="v">${fq(mc.lo)} – ${fq(mc.hi)}</div></div>
      <div class="k"><div class="l">Model band</div><div class="v">${fq(Mc.lo)} – ${fq(Mc.hi)}</div></div></div>
    <div class="card"><h2>Measured against model</h2>${chart({label:'Measured points over the model curve',x:[RNG.a,RNG.b],y:[y1-90,y1],ystep:10,xt:XT,ylab:'dB',series:[{cls,x:C.fs,y:C[ui.curve]}],points:pts})}
      ${legend([[ui.curve==='pre'?'c1':'c2','Model'],['c3','Measured']])}</div>`;
  }
};
/* ---------- check ---------- */
function summaryText(Q){
  const S=stats(Q),ck=runChecks(Q,S),N=ck.N,g=1+Q.R2/Q.R1,a=S.at,rss=Math.sqrt(Q.Rtol**2+Q.Ctol**2);
  const top=N.names[N.acc.indexOf(Math.max(...N.acc))],share=Math.max(...N.acc)/N.acc.reduce((x,y)=>x+y,0)*100;
  const Cn=snapUp(1/(2*Math.PI*(Q.Rprot+Q.Rload)*(parseSI(ui.tfp)>0?parseSI(ui.tfp):10)),E6);
  return ['ANALOG BAND-PASS CHAIN: ANALYSIS SUMMARY','',
   `Circuit: high-pass ${fmt(Q.Chigh,'F')} and ${fmt(Q.Rhigh,'Ω')} (${fq(1/(2*Math.PI*Q.Rhigh*Q.Chigh))}), gain ${g.toFixed(1)} V/V (${db(g).toFixed(1)} dB), low-pass ${fmt(Q.Rlow,'Ω')} and ${fmt(Q.Clow,'F')} (${fq(1/(2*Math.PI*Q.Rlow*Q.Clow))}), buffer, ${fmt(Q.Rprot,'Ω')} and ${fmt(Q.Cprot,'F')} in series, ${fmt(Q.Rload,'Ω')} load.`,
   `Designed response: ${S.cp.peak.toFixed(1)} dB peak, -3 dB points at ${fq(S.cp.lo)} and ${fq(S.cp.hi)}.`,
   `Output network: corner at ${fq(S.fprot)}. Loss is ${Math.abs(a(Math.sqrt(S.cp.lo*S.cp.hi)).div).toFixed(1)} dB at band centre. The delivered band is ${fq(S.cq.lo)} to ${fq(S.cq.hi)}.`,
   `Tolerance: ${(Q.Rtol*100).toFixed(0)}% resistors and ${(Q.Ctol*100).toFixed(0)}% capacitors move each corner by about ±${(rss*100).toFixed(1)}% (RSS).`,
   `Noise: ${fmt(N.total,'V',3)} rms at the load, mostly ${top.toLowerCase()} (${share.toFixed(0)}% of the power).`,
   ...ck.list.map(c=>`${{ok:'PASS',warn:'WARN',bad:'FAIL'}[c.s]}  ${c.n}: ${c.d}`),
   '',`Suggested capacitor for the output network: ${fmt(Cn,'F')}.`,'','Model: linear small-signal analysis with a time-domain simulation for clipping. Op-amp gain-bandwidth, slew rate, swing and current limit as entered.'].join('\n');
}
V.check={
  build(){return `<div id="res"></div>`;},
  calc(res){
    const Q=Pn(),S=stats(Q),ck=runChecks(Q,S).list,okn=ck.filter(c=>c.s==='ok').length,txt=summaryText(Q);
    res.innerHTML=`<div class="card"><h2>Design checks <span class="sp"></span><span class="note">${okn} of ${ck.length} pass. Targets come from the Design view.</span></h2>
      <ul class="checks">${ck.map(c=>`<li>${ledc(c.s)}<span>${c.n}</span><span class="d">${c.d}</span></li>`).join('')}</ul></div>
      <div class="card"><h2>Summary text</h2><div class="copybox" id="sumtxt"></div><div class="row" style="margin-top:8px"><button class="btn primary" id="copy" type="button">Copy text</button><span class="note" id="copied" role="status"></span></div></div>`;
    $('sumtxt').textContent=txt;
    $('copy').onclick=()=>{const done=()=>{$('copied').textContent='Copied';},fb=()=>{const r=document.createRange();r.selectNodeContents($('sumtxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copied').textContent='Press Ctrl+C to copy the selected text';};try{navigator.clipboard.writeText(txt).then(done,fb);}catch(e){fb();}};
  }
};
/* ---------- about ---------- */
V.about={
  build(){return `<div class="card prose"><h2>Passband</h2>
    <p>A model of an analog signal chain: passive high-pass, non-inverting gain stage, passive low-pass, unity buffer, and a series R and C into a load. It began as the analysis companion to a band-pass headphone amplifier and is set up to work for any conditioning chain of this shape, such as microphone preamps, biosignal front ends and sensor amplifiers. Pick an example in the header.</p>
    <h3>Why it matters</h3>
    <p>A series network added only to limit fault current looks harmless. Into a 32 Ω load, a 150 Ω resistor and 1 µF capacitor create a second high-pass at 874 Hz that cuts the signal by 34 dB at 100 Hz, which the filter design never accounted for. The same trap exists wherever a coupling capacitor or output resistor meets a low load impedance.</p>
    <h3>Using it</h3>
    <p>Edit values on the left in engineering notation, such as <code>7.8k</code>, <code>3.2n</code> or <code>220u</code>. Arrow keys step through standard values. On Response, drag the yellow handles on the chart. Every chart shows readings on hover or touch. Save builds by name, or copy a build code to share one. Keys <kbd>1</kbd> to <kbd>9</kbd> switch views.</p>
    <h3>Limits</h3>
    <p>Linear small-signal model, plus a time-domain simulation for clipping and slew. Op-amps are ideal apart from gain-bandwidth, slew rate, swing and current limit. Treat results as predictions to confirm on the bench.</p>
    <h3>Install</h3>
    <p>When served as a website, use the Install button or "Add to Home Screen". After the first visit it works offline.</p></div>`;}
};
/* ---------- builds and sharing ---------- */
const UKEYS=['vsrc','freq','target','tfl','tfh','tg','tfp'];
const snap=()=>({v:Object.fromEntries(Object.keys(DEF).map(k=>[k,$('in-'+k).value])),u:Object.fromEntries(UKEYS.map(k=>[k,ui[k]]))});
function applySnap(o){const v=o.v||o;for(const k of Object.keys(DEF)){if(typeof v[k]==='string')$('in-'+k).value=v[k];}if(o.u)for(const k of UKEYS)if(typeof o.u[k]==='string')ui[k]=o.u[k];read();$('preset').value='';show(tab);}
function loadBuilds(){try{return JSON.parse(localStorage.getItem('bb-builds')||'[]');}catch(e){return [];}}
function putBuilds(l){try{localStorage.setItem('bb-builds',JSON.stringify(l));return true;}catch(e){return false;}}
function renderBuilds(msg){
  const list=loadBuilds();
  $('builds').innerHTML=`<div class="row"><input class="inp left" id="bname" placeholder="Name this build" maxlength="40" aria-label="Build name" style="flex:1;min-width:0"><button class="btn sm" id="bsave" type="button">Save</button></div>
    <ul class="saved">${list.length?list.map((b,i)=>`<li><span>${esc(b.name)}</span><span style="flex:none"><button class="btn sm flat" data-l="${i}" type="button">Load</button> <button class="btn sm flat" data-d="${i}" type="button">Delete</button></span></li>`).join(''):'<li class="note">No saved builds yet.</li>'}</ul>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="bcode" type="button">Copy build code</button></div>
    <div class="row" style="margin-top:6px"><input class="inp left" id="bimp" placeholder="Paste a build code" aria-label="Build code" style="flex:1;min-width:0"><button class="btn sm" id="bload" type="button">Load</button></div>
    <p class="note" id="bmsg" role="status" style="margin-top:4px">${msg||''}</p>`;
  const say=m=>{$('bmsg').textContent=m;};
  const save=()=>{const n=$('bname').value.trim();if(!n){say('Give the build a name first.');return;}const l=loadBuilds().filter(b=>b.name!==n);l.unshift({name:n,...snap()});if(putBuilds(l.slice(0,20)))renderBuilds('Saved “'+n+'”.');else say('Saving is not available in this browser.');};
  $('bsave').onclick=save;$('bname').onkeydown=e=>{if(e.key==='Enter')save();};
  $('builds').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{applySnap(list[+b.dataset.l]);say('Loaded.');});
  $('builds').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const l=loadBuilds();l.splice(+b.dataset.d,1);putBuilds(l);renderBuilds('Deleted.');});
  $('bcode').onclick=()=>{const code='BPB2:'+btoa(unescape(encodeURIComponent(JSON.stringify(snap()))));
    try{navigator.clipboard.writeText(code).then(()=>say('Build code copied.'),()=>{$('bimp').value=code;$('bimp').select();say('Copy the code from the box.');});}catch(e){$('bimp').value=code;$('bimp').select();say('Copy the code from the box.');}};
  $('bload').onclick=()=>{const t=$('bimp').value.trim();if(!/^BPB[12]:/.test(t)){say('That is not a build code.');return;}
    try{applySnap(JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))));say('Loaded.');}catch(e){say('That build code could not be read.');}};
}
/* ---------- shell ---------- */
const TABS=['circuit','response','loading','tolerance','noise','level','design','listen','tools','validate','check','about'];
function show(t){
  if(!TABS.includes(t)) t='response';
  if(tab==='listen'&&t!=='listen')cancelAnimationFrame(AU.raf);
  tab=t;document.body.dataset.tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  if(t==='circuit')return;
  $('view').innerHTML=V[t].build();if(V[t].after)V[t].after();calc();
}
function numberFigs(){let n=0;document.querySelectorAll('#res .card').forEach(c=>{if(c.querySelector('.scr')){const h=c.querySelector('h2');if(h&&!h.querySelector('.fn')){n++;h.insertAdjacentHTML('afterbegin',`<span class="fn">Fig. ${n}</span>`);}}});}
function calc(){
  if(tab==='circuit'||!V[tab]||!V[tab].calc)return;
  const res=$('res');if(!res)return;
  CH.length=0;
  if(anyBad()){res.hidden=false;res.innerHTML='<div class="verdict bad"><div class="msg">Check the highlighted fields. Values like 4.7u, 7.8k or 3.2n are accepted.</div></div>';return;}
  res.hidden=false;
  setRange(stats(Pn()));
  V[tab].calc(res);numberFigs();
  try{localStorage.setItem('bb-state',JSON.stringify(snap()));}catch(e){}
}
function applyPreset(id){const p=PRESETS.find(x=>x[0]===id);if(!p)return;setVals(p[2]);Object.assign(ui,UI0,p[3]);show(tab);}
buildFields();
$('preset').innerHTML='<option value="">Custom values</option>'+PRESETS.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');
$('preset').addEventListener('change',e=>{if(e.target.value)applyPreset(e.target.value);});
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.tab;}));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||''))return;
  if(/^[1-9]$/.test(e.key)){location.hash=TABS[+e.key];}
});
$('theme').addEventListener('click',()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('bb-theme',r.dataset.theme);}catch(e){}});
try{const t=localStorage.getItem('bb-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false;});
$('install').addEventListener('click',()=>{if(deferred){deferred.prompt();deferred=null;$('install').hidden=true;}});
hoverInit($('view'));dragInit($('view'));
renderBuilds();
let saved=null;try{saved=JSON.parse(localStorage.getItem('bb-state')||'null');}catch(e){}
if(saved&&saved.v){setVals(saved.v);Object.assign(ui,UI0,saved.u||{});$('preset').value='';}else{setVals(PRESETS[0][2]);Object.assign(ui,UI0,PRESETS[0][3]);$('preset').value='built';}
show(location.hash.slice(1)||'response');
</script>
